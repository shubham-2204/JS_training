<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Management Application</title>
  <link rel="stylesheet" href="./styles/main.css" />
  <script type="module" src="./main.js" defer></script>
</head>
<body>
  <main class="app-container">

    <header class="app-header">
      <h1 class="app-title">Task Manager</h1>
    </header>

    <section class="task-form-section">
      <form id="task-form" novalidate>
        <div class="form-group">
          <label for="task-input" class="form-label">Task</label>
          <input type="text" id="task-input" class="form-input" placeholder="Enter task description"
            aria-required="true" maxlength="120" />
        </div>

        <div class="form-group">
          <label for="task-due-date" class="form-label">Due Date</label>
          <input type="date" id="task-due-date" class="form-input" />
        </div>

        <button type="submit" class="btn btn-primary">
          Add Task
        </button>
      </form>

      <div id="form-error" class="form-error" role="alert"></div>
    </section>

    <section class="filter-section">
      <button class="btn btn-filter" data-filter="ALL">All</button>
      <button class="btn btn-filter" data-filter="ACTIVE">Active</button>
      <button class="btn btn-filter" data-filter="COMPLETED">Completed</button>
    </section>

    <section class="task-list-section">
      <ul id="task-list" class="task-list"></ul>

      <div id="empty-state" class="empty-state hidden">
        No tasks available.
      </div>
    </section>

    <section class="stats-section">
      <p id="task-stats" class="stats-text"></p>
    </section>
  </main>
</body>
</html>
